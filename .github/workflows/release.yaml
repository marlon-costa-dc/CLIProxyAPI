name: release

on:
  push:
    # run only against tags
    tags:
      - '*'

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.4'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          changelog_notes_file="$(mktemp)"
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file" "$changelog_notes_file" "$updated_notes_file"' EXIT

          cat > "$release_notes_file" <<'EOF'
          <!-- cliproxyapi-linux-release-assets:start -->
          ## Linux release assets

          - `CLIProxyAPI_<version>_linux_<arch>.tar.gz` is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
          - `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.

          ## FreeBSD release assets

          - `CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz` is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.

          <!-- cliproxyapi-linux-release-assets:end -->
          EOF

          git fetch --force --tags
          previous_tag=""
          if previous_tag_value="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
            changelog_range="${previous_tag}..${GITHUB_REF_NAME}"
          else
            changelog_range="$GITHUB_REF_NAME"
          fi

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" |
            grep -Ev '^- (docs:|test:)' > "$changelog_entries_file" || true

          gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > "$generated_notes_file"
          if [[ ! -s "$generated_notes_file" ]]; then
            if [[ -n "$previous_tag" ]]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GH_REPO" "$previous_tag" "$GITHUB_REF_NAME" > "$generated_notes_file"
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' "$GH_REPO" "$GITHUB_REF_NAME" > "$generated_notes_file"
            fi
          fi

          {
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$changelog_notes_file"

          {
            cat "$release_notes_file"
            printf '\n'
            cat "$changelog_notes_file"
          } > "$updated_notes_file"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$updated_notes_file"
          fi

  build-hosted:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
            cgo_enabled: 1
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
            cgo_enabled: 1
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
            cgo_enabled: 0
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
            cgo_enabled: 0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh models catalog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build management center frontend
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/13210541230/Cli-Proxy-API-Management-Center.git /tmp/mc
          cd /tmp/mc
          npm ci
          VERSION=${GITHUB_REF_NAME} npm run build
          test -f dist/index.html
      - name: Build usage-service
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          cd /tmp/mc/usage-service
          mkdir -p /tmp/mc/dist/bin
          ext=""; [[ "$GOOS" == "windows" ]] && ext=".exe"
          echo "us_ext=${ext}" >> "$GITHUB_ENV"
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "/tmp/mc/dist/bin/usage-service${ext}" ./cmd/cpa-manager
          test -f "/tmp/mc/dist/bin/usage-service${ext}"
      - name: Package unified artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          [[ "$GOOS" == "windows" ]] && binary_name="cli-proxy-api.exe"

          archive_dir="dist/${TARGET}/archive"
          mkdir -p "$archive_dir"

          CGO_ENABLED="${CGO_ENABLED:-1}" GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/server/

          pkg_name="CLIProxyAPI_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            pkg_dir="dist/release/${pkg_name}"
            rm -rf "$pkg_dir"
            mkdir -p "$pkg_dir/static"
            cp "$archive_dir/$binary_name" "$pkg_dir/"
            cp "/tmp/mc/dist/bin/usage-service${us_ext:-}" "$pkg_dir/" || true
            cp LICENSE README.md README_CN.md config.example.yaml "$pkg_dir/"
            cp /tmp/mc/dist/index.html "$pkg_dir/static/management.html"
            { echo '@echo off'; echo 'setlocal'; echo 'cd /d %~dp0'; echo 'if exist usage-service.exe start "" usage-service.exe'; echo 'cli-proxy-api.exe --config config.example.yaml'; } > "$pkg_dir/start.bat"
            powershell -NoProfile -Command "Compress-Archive -Path '${pkg_dir}\\*' -DestinationPath 'dist\\release\\${pkg_name}.zip' -Force"
            rm -rf "$pkg_dir"
          else
            bash release/package-unified.sh \
              --version "${GITHUB_REF_NAME}" \
              --os "$GOOS" \
              --arch "$ASSET_ARCH" \
              --server-bin "$archive_dir/$binary_name" \
              --usage-bin "/tmp/mc/dist/bin/usage-service${us_ext:-}" \
              --management-html "/tmp/mc/dist/index.html" \
              --output-dir "dist/release"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: unified-${{ matrix.target }}
          path: dist/release/CLIProxyAPI_*
          if-no-files-found: error

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            goos: linux
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            goos: linux
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh models catalog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build management center frontend
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/13210541230/Cli-Proxy-API-Management-Center.git /tmp/mc
          cd /tmp/mc
          npm ci
          VERSION=${GITHUB_REF_NAME} npm run build
          test -f dist/index.html
      - name: Build usage-service
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mc/usage-service
          mkdir -p /tmp/mc/dist/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "/tmp/mc/dist/bin/usage-service" ./cmd/cpa-manager
          test -f "/tmp/mc/dist/bin/usage-service"
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build unified artifact (docker manylinux)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          mkdir -p "$archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

              glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          : "${us_ext:=}"
          bash release/package-unified.sh \
            --version "${GITHUB_REF_NAME}" \
            --os "linux" \
            --arch "$ASSET_ARCH" \
            --server-bin "$archive_dir/cli-proxy-api" \
            --usage-bin "/tmp/mc/dist/bin/usage-service" \
            --management-html "/tmp/mc/dist/index.html" \
            --output-dir "dist/release"
      - uses: actions/upload-artifact@v4
        with:
          name: unified-${{ matrix.target }}
          path: dist/release/CLIProxyAPI_*
          if-no-files-found: error

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            goos: linux
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            goos: linux
            asset_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh models catalog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build management center frontend
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/13210541230/Cli-Proxy-API-Management-Center.git /tmp/mc
          cd /tmp/mc
          npm ci
          VERSION=${GITHUB_REF_NAME} npm run build
          test -f dist/index.html
      - name: Build usage-service
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mc/usage-service
          mkdir -p /tmp/mc/dist/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "/tmp/mc/dist/bin/usage-service" ./cmd/cpa-manager
          test -f "/tmp/mc/dist/bin/usage-service"
      - name: Build unified no-plugin archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          mkdir -p "$archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/

          if readelf -l "$archive_dir/cli-proxy-api" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/cli-proxy-api" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi

          : "${us_ext:=}"
          bash release/package-unified.sh \
            --version "${GITHUB_REF_NAME}" \
            --os "linux" \
            --arch "${ASSET_ARCH}_no-plugin" \
            --server-bin "$archive_dir/cli-proxy-api" \
            --usage-bin "/tmp/mc/dist/bin/usage-service" \
            --management-html "/tmp/mc/dist/index.html" \
            --output-dir "dist/release"
      - uses: actions/upload-artifact@v4
        with:
          name: unified-${{ matrix.target }}
          path: dist/release/CLIProxyAPI_*
          if-no-files-found: error

  build-freebsd:
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            goos: freebsd
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            goos: freebsd
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build management center frontend
        run: |
          git clone --depth 1 https://github.com/13210541230/Cli-Proxy-API-Management-Center.git /tmp/mc
          cd /tmp/mc
          npm ci
          VERSION=${GITHUB_REF_NAME} npm run build
          test -f dist/index.html
      - name: Build usage-service
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd /tmp/mc/usage-service
          mkdir -p /tmp/mc/dist/bin
          go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "/tmp/mc/dist/bin/usage-service" ./cmd/cpa-manager
          test -f "/tmp/mc/dist/bin/usage-service"
      - name: Build cli-proxy-api
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/bin
          go build -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME} -X main.Commit=$(git rev-parse --short HEAD) -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "dist/bin/cli-proxy-api" ./cmd/server
      - name: Package unified artifact
        run: |
          : "${us_ext:=}"
          bash release/package-unified.sh \
            --version "${GITHUB_REF_NAME}" \
            --os freebsd \
            --arch ${{ matrix.asset_arch }}${{ matrix.asset_suffix }} \
            --server-bin "dist/bin/cli-proxy-api" \
            --usage-bin "/tmp/mc/dist/bin/usage-service" \
            --management-html "/tmp/mc/dist/index.html" \
            --output-dir "dist/release"
      - uses: actions/upload-artifact@v4
        with:
          name: unified-${{ matrix.target }}
          path: dist/release/CLIProxyAPI_*
          if-no-files-found: error

  publish-checksums:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-hosted
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/all-assets
          pattern: unified-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          find dist/all-assets -type f \( -name "*.zip" -o -name "*.tar.gz" \) -print0 | sort -z | xargs -0 sha256sum > checksums.txt

      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/all-assets/CLIProxyAPI_*.tar.gz dist/all-assets/CLIProxyAPI_*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'no release assets found\n' >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" checksums.txt --clobber
